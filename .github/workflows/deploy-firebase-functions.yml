name: Deploy Firebase Functions

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-functions:
    name: Deploy Firebase Functions
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "ERROR: FIREBASE_PROJECT_ID secret is not set"
            exit 1
          fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "ERROR: FIREBASE_SERVICE_ACCOUNT secret is not set"
            exit 1
          fi
          echo "All secrets found"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decode Firebase service account
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" | base64 --decode > ${HOME}/firebase-service-account.json

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Install functions dependencies
        working-directory: firebase-functions
        run: npm ci

      - name: Deploy Functions
        working-directory: firebase-functions
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=${HOME}/firebase-service-account.json
          firebase deploy --only functions --project "$FIREBASE_PROJECT_ID"
